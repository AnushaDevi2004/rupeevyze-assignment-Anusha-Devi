<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Section</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    background-color: #f5f7fa;
}
.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(to right, #1e3c72, #2a5298);
    color: white;
    padding: 20px;
}
.container {
    max-width: 600px;
}
.hero h1 {
    font-size: 2.7rem;
    margin-bottom: 15px;
    font-weight: bold;
}
.hero p {
    font-size: 1.1rem;
    margin-bottom: 25px;
    line-height: 1.6;
    opacity: 0.9;
}
.btn {
    display: inline-block;
    padding: 12px 25px;
    background-color: #ffcc00;
    color: #000;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
    transition: all 0.3s ease;
}
.btn:hover {
    background-color: #e6b800;
    transform: scale(1.05);
}
/* Responsive */
@media (max-width: 768px) {
    .hero h1 {
        font-size: 2rem;
    }

    .hero p {
        font-size: 1rem;
    }
}
    </style>
</head>
<body>

<section class="hero">
    <div class="container">
        <h1>Take Control of Your Financial Future</h1>
        <p>Track expenses, analyze spending, and make smarter financial decisions with ease.</p>
        <a href="#" class="btn">Get Started</a>
    </div>
</section>

</body>
</html>
